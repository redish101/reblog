# Default values for reblog.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

# 全局配置
global:
  # 镜像拉取策略
  imagePullPolicy: IfNotPresent
  # 镜像拉取密钥
  imagePullSecrets: []
  # 应用名称重写
  nameOverride: ""
  fullnameOverride: ""

# 后端配置
backend:
  # 是否启用后端
  enabled: true
  
  # 副本数量
  replicaCount: 1
  
  # 镜像配置
  image:
    repository: redish101/reblog-backend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # 服务配置
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  # Ingress 配置
  ingress:
    enabled: true
    host: "api.reblog.local"
    annotations:
      kubernetes.io/ingress.class: nginx
      nginx.ingress.kubernetes.io/cors-allow-origin: "*"
      nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
      nginx.ingress.kubernetes.io/cors-allow-headers: "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization"
      nginx.ingress.kubernetes.io/enable-cors: "true"
    paths:
      - path: /
        pathType: Prefix
    tls: []
    # - secretName: reblog-api-tls
    #   hosts:
    #     - api.reblog.local
  
  # 环境变量配置
  env:
    # 是否为开发模式
    dev: false
    # 服务端口
    port: 3000
    # 数据库连接字符串 (必填)
    databaseUrl: ""
    # 密钥 (用于生成JWT密钥对)
    secretKey: "reblog-secret"
    # 管理员邮箱
    ownerEmail: ""
    # GitHub OAuth 配置
    github:
      clientId: ""
      secret: ""
      redirectUrl: ""
    # 前端URL
    frontendUrl: ""
  
  # 资源限制
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 128Mi
  
  # 健康检查
  livenessProbe:
    httpGet:
      path: /api/v1/healthz
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /api/v1/healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  
  # 自动伸缩配置
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 10
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  # Pod 安全上下文
  podSecurityContext: {}
  securityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
  
  # Pod 注解和标签
  podAnnotations: {}
  podLabels: {}
  
  # 节点选择器
  nodeSelector: {}
  
  # 容忍度
  tolerations: []
  
  # 亲和性
  affinity: {}

# 前端配置
frontend:
  # 是否启用前端
  enabled: true
  
  # 副本数量
  replicaCount: 1

  # 镜像配置
  image:
    repository: redish101/reblog-frontend
    tag: "latest"
    pullPolicy: IfNotPresent
  
  # 服务配置
  service:
    type: ClusterIP
    port: 3000
    targetPort: 3000
  
  # Ingress 配置
  ingress:
    enabled: true
    host: "reblog.local"
    annotations:
      kubernetes.io/ingress.class: nginx
    paths:
      - path: /
        pathType: Prefix
    tls: []
    # - secretName: reblog-frontend-tls
    #   hosts:
    #     - reblog.local
  
  # 环境变量配置（构建时配置，这里不需要运行时环境变量）
  # 前端的环境变量应该在构建镜像时就确定，而不是在运行时注入
  
  # 资源限制
  resources:
    limits:
      cpu: 300m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  
  # 健康检查
  livenessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 30
    periodSeconds: 10
  
  readinessProbe:
    httpGet:
      path: /
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  
  # 自动伸缩配置
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 5
    targetCPUUtilizationPercentage: 80
    targetMemoryUtilizationPercentage: 80
  
  # Pod 安全上下文
  podSecurityContext: {}
  securityContext:
    readOnlyRootFilesystem: false
    runAsNonRoot: true
    runAsUser: 1000
  
  # Pod 注解和标签
  podAnnotations: {}
  podLabels: {}
  
  # 节点选择器
  nodeSelector: {}
  
  # 容忍度
  tolerations: []
  
  # 亲和性
  affinity: {}

# Ingress 配置
ingress:
  # Ingress 类名
  className: "nginx"

# 服务账户配置
serviceAccount:
  create: true
  automount: true
  annotations: {}
  name: ""
