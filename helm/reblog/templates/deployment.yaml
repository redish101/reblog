{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reblog.fullname" . }}-backend
  labels:
    {{- include "reblog.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  {{- if not .Values.backend.autoscaling.enabled }}
  replicas: {{ .Values.backend.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "reblog.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      {{- with .Values.backend.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "reblog.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
        {{- with .Values.backend.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "reblog.serviceAccountName" . }}
      {{- with .Values.backend.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: backend
          {{- with .Values.backend.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy | default .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.backend.service.targetPort }}
              protocol: TCP
          env:
            - name: DEV
              value: "{{ .Values.backend.env.dev }}"
            - name: PORT
              value: "{{ .Values.backend.env.port }}"
            - name: DATABASE_URL
              value: "{{ .Values.backend.env.databaseUrl }}"
            - name: SECRET_KEY
              value: "{{ .Values.backend.env.secretKey }}"
            {{- if .Values.backend.env.ownerEmail }}
            - name: OWNER_EMAIL
              value: "{{ .Values.backend.env.ownerEmail }}"
            {{- end }}
            {{- if .Values.backend.env.github.clientId }}
            - name: GITHUB_CLIENT_ID
              value: "{{ .Values.backend.env.github.clientId }}"
            {{- end }}
            {{- if .Values.backend.env.github.secret }}
            - name: GITHUB_SECRET
              value: "{{ .Values.backend.env.github.secret }}"
            {{- end }}
            {{- if .Values.backend.env.github.redirectUrl }}
            - name: GITHUB_REDIRECT_URL
              value: "{{ .Values.backend.env.github.redirectUrl }}"
            {{- end }}
            {{- if .Values.backend.env.frontendUrl }}
            - name: FRONTEND_URL
              value: "{{ .Values.backend.env.frontendUrl }}"
            {{- end }}
          {{- with .Values.backend.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.backend.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.backend.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.backend.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
---
