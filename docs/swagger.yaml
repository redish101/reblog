basePath: /api/v1
definitions:
  common.FailureResponse:
    properties:
      error:
        type: string
    type: object
  gorm.DeletedAt:
    properties:
      time:
        type: string
      valid:
        description: Valid is true if Time is not NULL
        type: boolean
    type: object
  handler.CreateOrUpdateCategoryRequest:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  handler.CreateOrUpdatePostRequest:
    properties:
      category:
        type: string
      content:
        type: string
      is_draft:
        type: boolean
      slug:
        type: string
      summary:
        type: string
      tags:
        items:
          type: string
        type: array
      title:
        type: string
    type: object
  handler.CreateOrUpdateTagRequest:
    properties:
      name:
        type: string
    type: object
  handler.GithubCallBackResponse:
    properties:
      email:
        type: string
      nickname:
        type: string
      username:
        type: string
    type: object
  handler.LogoutResponse:
    properties:
      message:
        type: string
    type: object
  model.CategoryModel:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      description:
        type: string
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  model.PostModel:
    properties:
      category:
        $ref: '#/definitions/model.CategoryModel'
      category_id:
        type: integer
      content:
        type: string
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      is_draft:
        type: boolean
      slug:
        type: string
      summary:
        type: string
      tags:
        items:
          $ref: '#/definitions/model.TagModel'
        type: array
      title:
        type: string
      updated_at:
        type: string
    type: object
  model.TagModel:
    properties:
      created_at:
        type: string
      deleted_at:
        $ref: '#/definitions/gorm.DeletedAt'
      id:
        type: integer
      name:
        type: string
      updated_at:
        type: string
    type: object
  store.PaginationResponse-model_CategoryModel:
    properties:
      data:
        description: 数据列表
        items:
          $ref: '#/definitions/model.CategoryModel'
        type: array
      has_next:
        description: 是否有下一页
        type: boolean
      has_prev:
        description: 是否有上一页
        type: boolean
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页大小
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  store.PaginationResponse-model_PostModel:
    properties:
      data:
        description: 数据列表
        items:
          $ref: '#/definitions/model.PostModel'
        type: array
      has_next:
        description: 是否有下一页
        type: boolean
      has_prev:
        description: 是否有上一页
        type: boolean
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页大小
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
  store.PaginationResponse-model_TagModel:
    properties:
      data:
        description: 数据列表
        items:
          $ref: '#/definitions/model.TagModel'
        type: array
      has_next:
        description: 是否有下一页
        type: boolean
      has_prev:
        description: 是否有上一页
        type: boolean
      page:
        description: 当前页码
        type: integer
      page_size:
        description: 每页大小
        type: integer
      total:
        description: 总记录数
        type: integer
      total_pages:
        description: 总页数
        type: integer
    type: object
info:
  contact: {}
  description: reblog 后端 api
  title: reblog api
  version: "1.0"
paths:
  /auth/github:
    get:
      consumes:
      - application/json
      description: 跳转到 GitHub OAuth 授权页面
      parameters:
      - description: 登录成功后的重定向地址
        in: query
        name: redirect_uri
        type: string
      produces:
      - application/json
      responses:
        "302":
          description: 重定向到 GitHub 授权页面
          schema:
            type: string
      summary: GitHub OAuth 登录
      tags:
      - auth
  /auth/github/callback:
    get:
      consumes:
      - application/json
      description: 处理 GitHub OAuth 回调，获取用户信息并生成 JWT token
      parameters:
      - description: GitHub OAuth 授权码
        in: query
        name: code
        required: true
        type: string
      - description: 状态参数
        in: query
        name: state
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 登录成功
          schema:
            $ref: '#/definitions/handler.GithubCallBackResponse'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: GitHub OAuth 回调
      tags:
      - auth
  /auth/logout:
    post:
      consumes:
      - application/json
      description: 清除登录状态
      produces:
      - application/json
      responses:
        "200":
          description: 登出成功
          schema:
            $ref: '#/definitions/handler.LogoutResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 登出
      tags:
      - auth
  /categories:
    get:
      consumes:
      - application/json
      description: 获取分类列表
      parameters:
      - description: 页码，默认为 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为 10
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/store.PaginationResponse-model_CategoryModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取分类列表
      tags:
      - category
    post:
      consumes:
      - application/json
      description: 创建新的分类
      parameters:
      - description: 创建分类的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/model.CategoryModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 创建分类
      tags:
      - category
  /categories/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定名称的分类
      parameters:
      - description: 分类名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 分类未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 删除分类
      tags:
      - category
    get:
      consumes:
      - application/json
      description: 根据分类 名称 获取分类详情
      parameters:
      - description: 分类名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/model.CategoryModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 分类未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取分类详情
      tags:
      - category
    put:
      consumes:
      - application/json
      description: 更新分类信息
      parameters:
      - description: 分类名称
        in: path
        name: name
        required: true
        type: string
      - description: 更新分类的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdateCategoryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/model.CategoryModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 分类未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 更新分类
      tags:
      - category
  /healthz:
    get:
      consumes:
      - application/json
      description: 健康检查
      produces:
      - application/json
      responses:
        "200":
          description: 安然无恙！
          schema:
            type: boolean
      summary: 健康检查
      tags:
      - healthz
  /posts:
    get:
      consumes:
      - application/json
      description: 获取文章列表
      parameters:
      - description: 页码，默认为 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为 10
        in: query
        name: size
        type: integer
      - collectionFormat: csv
        description: 分类名称过滤
        in: query
        items:
          type: string
        name: categories
        type: array
      - collectionFormat: csv
        description: 标签名称过滤
        in: query
        items:
          type: string
        name: tags
        type: array
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/store.PaginationResponse-model_PostModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取文章列表
      tags:
      - post
    post:
      consumes:
      - application/json
      description: 创建文章
      parameters:
      - description: 创建文章的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 创建成功
          schema:
            $ref: '#/definitions/model.PostModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "401":
          description: 未授权
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "403":
          description: 权限不足
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 创建文章
      tags:
      - post
  /posts/{slug}:
    delete:
      consumes:
      - application/json
      description: 删除文章
      parameters:
      - description: 文章 Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 删除成功
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 文章未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 删除文章
      tags:
      - post
    get:
      consumes:
      - application/json
      description: 获取文章详情
      parameters:
      - description: 文章 Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 获取成功
          schema:
            $ref: '#/definitions/model.PostModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 文章未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取文章详情
      tags:
      - post
    put:
      consumes:
      - application/json
      description: 更新文章
      parameters:
      - description: 文章 Slug
        in: path
        name: slug
        required: true
        type: string
      - description: 更新文章的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 更新成功
          schema:
            $ref: '#/definitions/model.PostModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 文章未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 更新文章
      tags:
      - post
  /tags:
    get:
      consumes:
      - application/json
      description: 获取标签的列表
      parameters:
      - description: 页码，默认为 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认为 10
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取标签列表
          schema:
            $ref: '#/definitions/store.PaginationResponse-model_TagModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取标签列表
      tags:
      - tag
    post:
      consumes:
      - application/json
      description: 创建一个新的标签
      parameters:
      - description: 创建标签的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdateTagRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 成功创建标签
          schema:
            $ref: '#/definitions/model.TagModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 创建标签
      tags:
      - tag
  /tags/{name}:
    delete:
      consumes:
      - application/json
      description: 删除指定名称的标签
      parameters:
      - description: 标签名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: 成功删除标签
        "404":
          description: 标签未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 删除标签
      tags:
      - tag
    get:
      consumes:
      - application/json
      description: 获取指定名称的标签详情
      parameters:
      - description: 标签名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功获取标签详情
          schema:
            $ref: '#/definitions/model.TagModel'
        "404":
          description: 标签未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      summary: 获取标签详情
      tags:
      - tag
    put:
      consumes:
      - application/json
      description: 更新现有标签
      parameters:
      - description: 更新标签的请求体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handler.CreateOrUpdateTagRequest'
      - description: 标签名称
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 成功更新标签
          schema:
            $ref: '#/definitions/model.TagModel'
        "400":
          description: 请求参数错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "404":
          description: 标签未找到
          schema:
            $ref: '#/definitions/common.FailureResponse'
        "500":
          description: 服务器内部错误
          schema:
            $ref: '#/definitions/common.FailureResponse'
      security:
      - ApiKeyAuth: []
      summary: 更新标签
      tags:
      - tag
securityDefinitions:
  ApiKeyAuth:
    description: JWT token stored in cookie
    in: cookie
    name: token
    type: apiKey
swagger: "2.0"
